<!doctype html>
<html lang="es-419">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPOTRA — tarjeta para compartir</title>
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@700&f[]=general-sans@500,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#070907;color:#f5f7f3}
.card{position:relative;width:1200px;height:630px;isolation:isolate;padding:48px 60px}
.park{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-3}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,9,7,.98) 0%,rgba(7,9,7,.93) 48%,rgba(7,9,7,.48) 100%);z-index:-2}
.line{position:absolute;top:0;left:0;right:0;height:8px;background:#74ff3a}
.brand{width:274px;height:auto;display:block;margin-bottom:45px}
h1{font:700 66px/.99 'Clash Display',sans-serif;letter-spacing:-2.5px;margin:0;max-width:740px}
h1 span{color:#74ff3a}
.note{font:500 21px/1.5 'General Sans',sans-serif;margin:24px 0 0;color:#d6dfcf;max-width:690px}
.spotri{position:absolute;right:54px;bottom:60px;width:332px;height:500px;object-fit:contain;object-position:bottom}
.disciplines{position:absolute;left:60px;bottom:35px;font:600 17px/1 'General Sans',sans-serif;letter-spacing:2.1px;color:#74ff3a}
.stamp{position:absolute;right:56px;bottom:29px;font:600 12px/1.3 'General Sans',sans-serif;letter-spacing:1.8px;text-align:center;width:334px;color:#e1e6dc}
</style>
<main class="card">
<img class="park" src="../dist/assets/rider-park.webp" alt=""><div class="shade"></div><div class="line"></div>
<img class="brand" src="../dist/assets/logo.webp" alt="SPOTRA">
<h1>TU PRÓXIMA<br>SESIÓN<br><span>EMPIEZA ACÁ.</span></h1>
<p class="note">Hecho por la comunidad, para la comunidad.<br>Desde Latinoamérica.</p>
<img class="spotri" src="../dist/assets/spotri-skate-front.webp" alt="SPOTRI sobre su skate">
<p class="disciplines">SKATE / BMX / ROLLERS / SCOOTER</p>
<p class="stamp">ENCONTRÁ. CONECTÁ. RODÁ.</p>
</main>
</html>
